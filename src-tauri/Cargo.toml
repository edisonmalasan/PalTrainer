[package]
name = "paltrainer"
version = "0.1.0"
description = "A Tauri desktop app for Palworld save inspection and editing."
authors = ["PalTrainer contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "paltrainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.5", features = [] }

[dev-dependencies]
tempfile = "3.12"
