[package]
name = "paltrainer"
version = "0.1.0"
description = "A Tauri desktop app for Palworld save inspection and editing."
authors = ["PalTrainer contributors"]
license = "MIT"
homepage = "https://github.com/edisonmalasan/PalTrainer"
repository = "https://github.com/edisonmalasan/PalTrainer"
readme = "../README.md"
keywords = ["palworld", "save-editor", "tauri", "desktop"]
categories = ["games", "utilities"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "paltrainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2.4"
flate2 = "1.0"
thiserror = "2.0"
dirs = "6.0"
crc32fast = "1.4"
fastrand = "2.3"
dunce = "1.0"

[dev-dependencies]
tempfile = "3.12"
