name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend tests and browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  rust:
    name: Rust format and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --lib

  release-policy:
    name: Release policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unapproved Oodle binaries
        shell: bash
        run: |
          if find . -type f \( -iname '*oodle*' -o -iname '*kraken*.dll' -o -iname '*oo2core*.dll' \) -not -path './.git/*' | grep -q .; then
            echo "Unapproved Oodle/Kraken binary detected in the repository."
            exit 1
          fi
      - name: Verify release guidance is present
        shell: bash
        run: |
          test -f RELEASE_VALIDATION.md
          test -f .github/RELEASE_SIGNING.md
          test -f .github/RELEASE_NOTES_TEMPLATE.md
